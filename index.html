
<!doctype html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Leprechaun Turkey</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>

   <div class="cartoon">

      <!-- Rainbow tail feathers -->
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>
      <div class="tail"></div>

      <!-- Pot of gold -->
      <div class="pot">
         <div class="coin coin1"></div>
         <div class="coin coin2"></div>
         <div class="coin coin3"></div>
      </div>

      <!-- Legs -->
      <div class="leg"></div>
      <div class="leg"></div>

      <!-- Body and wings -->
      <div class="body"></div>
      <div class="wing"></div>
      <div class="wing"></div>

      <!-- Leprechaun hat -->
      <div class="hat-top"></div>
      <div class="hat-bottom"></div>

      <!-- Head and orange beard -->
      <div class="head">
         <div class="beard"></div>
         <div class="eye"></div>
         <div class="beak"></div>
         <div class="red"></div>
      </div>

      <!-- Shamrock decoration -->
      <div class="shamrock">☘</div>

   </div>
